version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
    networks:
      - ecommerce-network
    volumes:
      - mysql-data:/var/lib/mysql
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    env_file:
      - ./eureka-server/.env
    networks:
      - ecommerce-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    env_file:
      - ./api-gateway/.env
    depends_on:
      - eureka-server
    networks:
      - ecommerce-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./auth-service/.env
    depends_on:
      - eureka-server
    networks:
      - ecommerce-network

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
      - "5005:5005"
    env_file:
      - ./product-service/.env
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      - eureka-server
    networks:
      - ecommerce-network

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    env_file:
      - ./order-service/.env
    depends_on:
      - eureka-server
      - product-service
    networks:
      - ecommerce-network

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8084:8084"
    env_file:
      - ./cart-service/.env
    depends_on:
      - eureka-server
    networks:
      - ecommerce-network

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    env_file:
      - ./payment-service/.env
    depends_on:
      - eureka-server
      - order-service
    networks:
      - ecommerce-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    env_file:
      - ./notification-service/.env
    depends_on:
      - eureka-server
    networks:
      - ecommerce-network


networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql-data: