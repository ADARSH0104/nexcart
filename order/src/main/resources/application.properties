spring.application.name=order-service

server.port = 8084

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.database-platform = org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/product_db
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.kafka.bootstrap-servers=https://localhost:9092
spring.kafka.consumer.group-id=order-group
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.UUIDDeserializer
#spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
